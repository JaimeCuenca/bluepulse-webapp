name = "bluepulse-webapp"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

# Los secretos reales (GITHUB_TOKEN, APP_PASSWORD se configuran en cloudfare)

[vars]
DATA_REPO = "JaimeCuenca/bluepulse-data"
DATA_BRANCH = "main"
#
# Para desarrollo local (wrangler pages dev), crea un archivo .dev.vars
# (no se sube a git) con:
#   GITHUB_TOKEN=ghp_xxx
#   DATA_REPO=tu_usuario/bluepulse-data
#   DATA_BRANCH=main
#   APP_PASSWORD=tu_contraseña
